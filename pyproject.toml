[tool.poetry]
name = "building-energy-standards-data"
version = "0.2.1"
description = ""
authors = ["Lerond, Jeremy <jeremy.lerond@pnnl.gov>", "Xu, Weili <weili.xu@pnnl.gov>", "Lei, Xuechen <xuechen.lei@pnnl.gov>", "Wang, Lingzhe <lingzhe.wang@pnnl.gov>", "Dehwah, Ammar <ammar.dehwah@pnnl.gov>", "Slane-Holloway, Julian <julian.slane-holloway@pnnl.gov>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^7.4.3"
black = "22.12.0"


[tool.poetry.group.agent]
optional = true

[tool.poetry.group.agent.dependencies]
langchain = ">=0.3.25"
langchain-community = ">=0.3.25"
langchain-core = ">=0.3.65"
streamlit = ">=1.47.0"
langchain-anthropic = "^0.3.18"

[tool.poetry.group.fine_tuning]
optional = true

[tool.poetry.group.fine_tuning.dependencies]
datasets = ">=4.2.0"
numpy = ">=2.3.4"
peft = ">=0.17.1"
scipy = "*"
torch = ">=1.8.1"
tqdm = "*"
transformers = "*"
langchain="*"
langchain_huggingface="*"
dotenv="*"
openpyxl="*"
nltk="*"
nlpaug = "^1.1.11"
chromadb="*"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
